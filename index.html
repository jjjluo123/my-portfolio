```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作品集</title>
    <style>
        body { background: #f5f5f5; font-family: sans-serif; padding: 20px; margin: 0; }
        .gallery { display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 800px; margin: 0 auto; }
        .gallery img { width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="gallery" id="gallery"></div>
    <script>
        const repo = 'jjjluo123/my-portfolio';
        const urls = [`https://api.github.com/repos/${repo}/contents/`, `https://api.github.com/repos/${repo}/contents/gallery`];
        
        Promise.all(urls.map(url => fetch(url).then(res => res.json())))
            .then(results => {
                const gallery = document.getElementById('gallery');
                let allFiles = [];
                
                results.forEach(data => {
                    if (Array.isArray(data)) {
                        data.forEach(file => {
                            if (file.type === 'file' && /\.(png|jpg|jpeg|webp)$/i.test(file.name)) {
                                allFiles.push(file);
                            }
                        });
                    }
                });

                // 核心修改：使用自然排序，不管文件名多乱，带数字的都会按1、2、3...15的顺序排好
                allFiles.sort((a, b) => {
                    return new Intl.Collator(undefined, {numeric: true, sensitivity: 'base'}).compare(a.name, b.name);
                });

                allFiles.forEach(file => {
                    const img = document.createElement('img');
                    
                    // 核心修改：把 GitHub 的图片链接换成国内手机能访问的 jsDelivr 免费加速通道
                    let url = file.download_url;
                    if (url.includes('raw.githubusercontent.com')) {
                        url = url.replace('raw.githubusercontent.com', 'cdn.jsdelivr.net/gh').replace('/master/', '@master/');
                    }
                    
                    img.src = url;
                    img.loading = "lazy"; 
                    gallery.appendChild(img);
                });
            });
    </script>
</body>
</html>
