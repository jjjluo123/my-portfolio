
```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作品集</title>
    <style>
        body { background: #f5f5f5; font-family: sans-serif; padding: 20px; margin: 0; }
        .gallery { display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 800px; margin: 0 auto; }
        .gallery img { width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="gallery" id="gallery"></div>
    <script>
        const repo = 'jjjluo123/my-portfolio';
        const urls = [`https://api.github.com/repos/${repo}/contents/`, `https://api.github.com/repos/${repo}/contents/gallery`];
        
        Promise.all(urls.map(url => fetch(url).then(res => res.json())))
            .then(results => {
                const gallery = document.getElementById('gallery');
                let allFiles = [];
                
                results.forEach(data => {
                    if (Array.isArray(data)) {
                        data.forEach(file => {
                            if (file.type === 'file' && /\.(png|jpg|jpeg|webp)$/i.test(file.name)) {
                                allFiles.push(file);
                            }
                        });
                    }
                });

                allFiles.sort((a, b) => {
                    return new Intl.Collator(undefined, {numeric: true, sensitivity: 'base'}).compare(a.name, b.name);
                });

                allFiles.forEach(file => {
                    const img = document.createElement('img');
                    
                    // 【终极修改】使用极其稳定的 wsrv.nl 图片代理，无视中文文件名，国内秒开
                    let rawUrl = file.download_url; 
                    let proxyUrl = 'https://wsrv.nl/?url=' + encodeURIComponent(rawUrl);
                    
                    img.src = proxyUrl;
                    img.loading = "lazy"; 
                    gallery.appendChild(img);
                });
            });
    </script>
</body>
</html>
